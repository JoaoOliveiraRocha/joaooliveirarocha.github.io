<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" role="img" aria-label="Coding-agent loop: You send a task to the Harness on your machine; the Harness loops with the LLM and Tools until there are no more tool calls, then returns the final text to You.">
  <defs>
    <marker id="ah" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="12" refX="14" refY="6" orient="auto">
      <polygon points="0,0 14,6 0,12" fill="#6d6250"/>
    </marker>
    <marker id="ah-loop" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="12" refX="14" refY="6" orient="auto">
      <polygon points="0,0 14,6 0,12" fill="#a8402f"/>
    </marker>
  </defs>

  <!-- Your machine frame -->
  <rect x="10" y="10" width="615" height="480" rx="16" ry="16" fill="none" stroke="#6d6250" stroke-width="1.5" stroke-dasharray="8 6"/>
  <text x="28" y="40" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="20" fill="#6d6250">Your machine</text>

  <!-- Boxes -->
  <rect x="25" y="70" width="140" height="100" rx="14" ry="14" fill="#ece0c3" stroke="#2b2318" stroke-width="1.5"/>
  <text x="95" y="130" text-anchor="middle" font-family="Georgia, 'New York', ui-serif, serif" font-size="28" fill="#2b2318">You</text>

  <rect x="25" y="340" width="140" height="100" rx="14" ry="14" fill="#ece0c3" stroke="#2b2318" stroke-width="1.5"/>
  <text x="95" y="400" text-anchor="middle" font-family="Georgia, 'New York', ui-serif, serif" font-size="28" fill="#2b2318">Tools</text>

  <rect x="380" y="60" width="220" height="380" rx="18" ry="18" fill="#11322414" stroke="#113224" stroke-width="3"/>
  <text x="490" y="261" text-anchor="middle" font-family="Georgia, 'New York', ui-serif, serif" font-size="32" fill="#2b2318">Harness</text>

  <rect x="840" y="190" width="140" height="120" rx="14" ry="14" fill="#ece0c3" stroke="#2b2318" stroke-width="1.5"/>
  <text x="910" y="260" text-anchor="middle" font-family="Georgia, 'New York', ui-serif, serif" font-size="28" fill="#2b2318">LLM</text>

  <!-- 1: You -> Harness -->
  <line x1="165" y1="105" x2="380" y2="105" stroke="#6d6250" stroke-width="2.5" marker-end="url(#ah)"/>
  <text x="272" y="93" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="20" fill="#6d6250">task</text>

  <!-- 5: Harness -> You -->
  <line x1="380" y1="140" x2="165" y2="140" stroke="#6d6250" stroke-width="2.5" marker-end="url(#ah)"/>
  <text x="272" y="168" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="20" fill="#6d6250">final text</text>

  <!-- 2: Harness -> LLM -->
  <line x1="600" y1="230" x2="840" y2="230" stroke="#6d6250" stroke-width="2.5" marker-end="url(#ah)"/>
  <text x="732" y="214" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="20" fill="#6d6250">full history</text>

  <!-- 3: LLM -> Harness -->
  <line x1="840" y1="275" x2="600" y2="275" stroke="#6d6250" stroke-width="2.5" marker-end="url(#ah)"/>
  <text x="732" y="302" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="18" fill="#6d6250">ask for tool</text>

  <!-- 4: Harness -> Tools -->
  <line x1="380" y1="365" x2="165" y2="365" stroke="#6d6250" stroke-width="2.5" marker-end="url(#ah)"/>
  <text x="272" y="342" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="20" fill="#6d6250">calls</text>

  <!-- Loop arrow: result back into history -->
  <line x1="165" y1="410" x2="380" y2="410" stroke="#a8402f" stroke-width="3.5" marker-end="url(#ah-loop)"/>
  <text x="272" y="438" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="20" fill="#a8402f">result</text>
</svg>
