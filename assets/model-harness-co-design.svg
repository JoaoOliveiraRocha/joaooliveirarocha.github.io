<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2000 1116" width="2000" height="1116" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
