<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>iframe tester</title>
    <style>
        body, html {
          padding: 0;
          overflow: hidden;
          margin: 0;
          display: flex;
          flex: 1 0;
        }
        iframe {
          border: none;
        }
        #debug {
          display: none;
          position: absolute;
          top: 0;
          left: 0;
          background: rgba(255,255,255,0.9);
          padding: 10px;
          font-family: monospace;
          font-size: 12px;
          max-width: 100%;
          overflow: auto;
          max-height: 200px;
          z-index: 9999;
        }
    </style>
  </head>
  <body>
    <div id="debug"></div>
    
    <script>   
      const parseUrlParams = () => {
        const urlParams = new URLSearchParams(window.location.search);
        const width = urlParams.get('width') || '498';
        const height = urlParams.get('height') || '638';
        
        const queryString = window.location.search;
        
        if (!queryString.includes('url=')) {
          return { width, height, url: null };
        }
        
        const urlPrefix = queryString.includes('?url=') ? '?url=' : '&url=';
        const urlStart = queryString.indexOf(urlPrefix) + urlPrefix.length;
        let urlValue = queryString.substring(urlStart);
        
        const widthIndex = urlValue.indexOf('&width=');
        if (widthIndex !== -1) {
          const nextParam = urlValue.indexOf('&', widthIndex + 1);
          if (nextParam !== -1) {
            urlValue = urlValue.substring(0, widthIndex) + urlValue.substring(nextParam);
          } else {
            urlValue = urlValue.substring(0, widthIndex);
          }
        }
        
        const heightIndex = urlValue.indexOf('&height=');
        if (heightIndex !== -1) {
          const nextParam = urlValue.indexOf('&', heightIndex + 1);
          if (nextParam !== -1) {
            urlValue = urlValue.substring(0, heightIndex) + urlValue.substring(nextParam);
          } else {
            urlValue = urlValue.substring(0, heightIndex);
          }
        }
        
        const decodedUrl = decodeURIComponent(urlValue);
        
        return { width, height, url: decodedUrl };
      }
      
      const params = parseUrlParams();

      document.documentElement.style.width = params.width + 'px';
      document.body.style.width = params.width + 'px';
      document.documentElement.style.height = params.height + 'px';
      document.body.style.height = params.height + 'px';

      const iframe = document.createElement('iframe');
      iframe.src = params.url;
      iframe.width = '100%';
      iframe.height = '100%';
      iframe.sandbox = "allow-same-origin allow-scripts allow-downloads allow-forms allow-modals allow-orientation-lock allow-pointer-lock allow-popups allow-popups-to-escape-sandbox allow-presentation allow-storage-access-by-user-activation allow-top-navigation-by-user-activation";
      iframe.fetchpriority = "auto";
      iframe.allow = "accelerometer; autoplay; gyroscope; payment; challenges.cloudflare.com; about:blank; about:srcdoc";
      iframe.style.display = 'none';

      document.body.appendChild(iframe);      

      iframe.onload = () => {
        iframe.style.display = 'block';
      };
    </script>
  </body>
</html>
